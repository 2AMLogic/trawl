name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

# Each run gets its own concurrency group, so nothing is ever cancelled or
# superseded. The merge-group run keys on its unique queue head SHA
# (github.sha), isolating it from PR and push runs; checkout then tests the
# combined merge-group tree, not the PR head or main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.23.4", "24.22.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      # The render tests skip without a browser, so fetch one to keep them
      # meaningful in CI.
      - run: npx --yes playwright install --with-deps chromium --only-shell
      - run: npm test
